        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; overflow: hidden; color: var(--text); }
        .hidden { display: none !important; }
        
        /* Auth & Containers */
        .auth-container { max-width: 450px; margin: 40px auto; padding: 30px; background: white; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1.5px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        label { display: block; text-align: left; font-weight: bold; font-size: 0.85rem; margin-top: 10px; color: var(--primary); }
        
        button { cursor: pointer; border: none; border-radius: 10px; font-weight: bold; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-main { background: var(--primary); color: white; padding: 16px; width: 100%; font-size: 1rem; margin-top: 10px; }
        .btn-link { background: none; color: var(--primary); font-size: 0.9rem; text-decoration: underline; margin-top: 10px; width: 100%; }
        .btn-header { color: white; padding: 6px 12px; font-size: 0.8rem; }
        .btn-voltar { background: #6c757d; }
        .btn-sair { background: var(--danger); }

        /* Dashboard */
        #dashboard { height: 100vh; display: flex; flex-direction: column; }
        .header-dash { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 25px; border-bottom: 1px solid #ddd; z-index: 100; }
        .header-btns { display: flex; gap: 10px; }
        
        .carousel-container { position: relative; flex-grow: 1; display: flex; align-items: center; overflow: hidden; background: #e9ecef; }
        .student-track { display: flex; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; height: 100%; }
        
        .student-card { min-width: 100%; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .card-content { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); max-height: 90vh; overflow-y: auto; }
        
        /* Foto */ 
        .photo-container { position: relative; width: 100px; height: 100px; margin: 0 auto 10px; }
        .photo-placeholder { width: 100%; height: 100%; background: #f0f7ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid var(--primary); overflow: hidden; }
        .photo-placeholder img { width: 100%; height: 100%; object-fit: cover; }
        .btn-upload-label { position: absolute; bottom: 0; right: 0; background: var(--primary); color: white; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 30px; border: 2px solid white; cursor: pointer; text-align: center; }

        .toggle-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8f9fa; border-radius: 10px; margin-bottom: 5px; border: 1px solid #eee; font-size: 0.9rem; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: var(--primary); color: white; width: 45px; height: 45px; border-radius: 50%; z-index: 1000; border: none; font-size: 20px; }

        .arrow-right { right: 10px; }
        
        .btn-pdf { background: #5f6368; color: white; width: 100%; padding: 12px; margin-top: 15px; }
        textarea { height: 50px; resize: none; font-family: inherit; }

        });
        
        if(error) alert("Erro: " + error.message);
        else alert("E-mail de recuperação enviado! Verifique sua caixa de entrada.");
    }

    async function acaoCriarConta() {
        const email = document.getElementById('cad-email').value;
        const password = document.getElementById('cad-senha').value;
        const { error } = await _supabase.auth.signUp({ email, password });
        if(error) alert(error.message);
        else alert("Conta criada! Já pode fazer login.");
    }

    async function iniciarConselho() {
        const turno = document.getElementById('sel-turno').value;
        const turma = document.getElementById('sel-turma').value;
        const bimestre = document.getElementById('sel-bimestre').value;
        const nomes = turmasDados[turno][turma];
        totalAlunos = nomes.length;
        currentIndex = 0;

        document.getElementById('info-header').innerText = `🏫 ${turma} | 📅 ${bimestre}`;
        const track = document.getElementById('student-track');
        track.innerHTML = '🔄 Sincronizando...';

        const { data: todosDados } = await _supabase.from('conselho_classe').select('*').match({ turma, bimestre });

        let html = '';
        nomes.forEach(nome => {
            const db = todosDados?.find(d => d.nome === nome) || {};
            const idSeguro = nome.replace(/\s/g, '');
            const fUrl = db.foto_url || '';

            html += `
                <div class="student-card">
                    <div class="card-content">
                        <div class="photo-container">
                            <div class="photo-placeholder" id="img-${idSeguro}">
                                ${fUrl ? `<img src="${fUrl}" crossorigin="anonymous">` : '👤'}
                            </div>
                            <label class="btn-upload-label">
                                📷 <input type="file" class="hidden" onchange="uploadFoto('${nome}', this)">
                            </label>
                        </div>
                        <h3 style="text-align:center; margin: 5px 0 10px;">${nome}</h3>
                        
                        <div class="toggle-item"><span>⚠️ Infrequente</span> <label class="switch"><input type="checkbox" onchange="sync('${nome}','infrequente',this.checked)" ${db.infrequente?'checked':''}><span class="slider"></span></label></div>
                        <div class="toggle-item"><span>📉 Baixa Participação</span> <label class="switch"><input type="checkbox" onchange="sync('${nome}','participacao',this.checked)" ${db.participacao?'checked':''}><span class="slider"></span></label></div>
                        <div class="toggle-item"><span>📚 Não entrega atividades</span> <label class="switch"><input type="checkbox" onchange="sync('${nome}','atividades',this.checked)" ${db.atividades?'checked':''}><span class="slider"></span></label></div>
                        <div class="toggle-item"><span>🚫 Indisciplina</span> <label class="switch"><input type="checkbox" onchange="sync('${nome}','disciplina',this.checked)" ${db.disciplina?'checked':''}><span class="slider"></span></label></div>
                        
                        <label>📞 Conversa com responsável (PDT/Família):</label>
                        <textarea placeholder="Relate o contato feito..." onblur="sync('${nome}','conversa_familia',this.value)">${db.conversa_familia || ''}</textarea>

                        <label>📝 Observação do Conselho:</label>
                        <textarea placeholder="Pontos debatidos..." onblur="sync('${nome}','obs',this.value)">${db.obs || ''}</textarea>
                        
                        <label>🎯 Devolutiva/Encaminhamento:</label>
                        <textarea placeholder="Ações a serem tomadas..." onblur="sync('${nome}','feedback',this.value)">${db.feedback || ''}</textarea>
                        
                        <button class="btn-pdf" onclick="gerarPdfIndividual('${nome}')">📥 BAIXAR PDF COMPLETO</button>
                    </div>
                </div>`;
        });

        track.innerHTML = html;
        mostrarTela('dashboard');
        document.getElementById('student-track').style.transform = `translateX(0)`;
        atualizarNavegacao();
    }

    async function sync(nome, campo, valor) {
        const turma = document.getElementById('sel-turma').value;
        const bimestre = document.getElementById('sel-bimestre').value;
        await _supabase.from('conselho_classe').upsert(
            { nome, turma, bimestre, [campo]: valor }, 
            { onConflict: 'nome,turma,bimestre' }
        );
    }

    async function uploadFoto(nome, input) {
        const file = input.files[0];
        if(!file) return;
        const idSeguro = nome.replace(/\s/g, '');
        const placeholder = document.getElementById(`img-${idSeguro}`);
        placeholder.innerHTML = "⏳";
        const fileName = `${Date.now()}_${idSeguro}.jpg`;

        const { error } = await _supabase.storage.from('fotos-alunos').upload(fileName, file);
        if (error) { alert("Erro no upload!"); placeholder.innerHTML = "👤"; return; }

        const { data } = _supabase.storage.from('fotos-alunos').getPublicUrl(fileName);
        const publicUrl = data.publicUrl;
        await sync(nome, 'foto_url', publicUrl);
        placeholder.innerHTML = `<img src="${publicUrl}" crossorigin="anonymous">`;
    }

    function moveSlide(dir) {
        currentIndex = Math.max(0, Math.min(totalAlunos - 1, currentIndex + dir));
        document.getElementById('student-track').style.transform = `translateX(-${currentIndex * 100}%)`;
        atualizarNavegacao();
    }

    function atualizarNavegacao() {
        document.getElementById('btn-prev').disabled = (currentIndex === 0);
        document.getElementById('btn-next').disabled = (currentIndex === totalAlunos - 1);
    }

    async function gerarPdfIndividual(nome) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const turma = document.getElementById('sel-turma').value;
        const bimestre = document.getElementById('sel-bimestre').value;

        const { data: d } = await _supabase.from('conselho_classe').select('*').match({ nome, turma, bimestre }).single();

        doc.setFillColor(26, 115, 232);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(20);
        doc.text("EEMTI DRAGÃO DO MAR", 105, 20, {align: 'center'});
        doc.setFontSize(14);
        doc.text("Relatório Individual de Conselho de Classe", 105, 30, {align: 'center'});

        if (d?.foto_url) {
            try {
                const img = new Image();
                img.src = d.foto_url;
                img.crossOrigin = "anonymous";
                await new Promise(resolve => img.onload = resolve);
                doc.addImage(img, 'JPEG', 160, 45, 30, 30);
            } catch(e) { console.log("Erro na foto"); }
        }

        doc.setTextColor(0);
        doc.setFontSize(11);
        doc.text(`ALUNO: ${nome}`, 20, 50);
        doc.text(`TURMA: ${turma} | BIMESTRE: ${bimestre}`, 20, 58);
        //doc.line(20, 62, 190, 62);

        doc.setTextColor(26, 115, 232);
        doc.text("SITUAÇÃO PEDAGÓGICA:", 20, 75);
        doc.setTextColor(0);
        doc.text(`- Infrequente: ${d?.infrequente ? 'SIM' : 'NÃO'}`, 25, 82);
        doc.text(`- Baixa Participação: ${d?.participacao ? 'SIM' : 'NÃO'}`, 25, 88);
        doc.text(`- Não entrega atividades: ${d?.atividades ? 'SIM' : 'NÃO'}`, 25, 94);
        doc.text(`- Problemas disciplinares: ${d?.disciplina ? 'SIM' : 'NÃO'}`, 25, 100);

        const sessao = (tit, txt, y) => {
            doc.setTextColor(26, 115, 232);
            doc.text(tit, 20, y);
            doc.setTextColor(0);
            const lines = doc.splitTextToSize(txt || "Não informado.", 160);
            doc.text(lines, 20, y+7);
            return y + (lines.length * 7) + 15;
        };

        let curY = 115;
        curY = sessao("CONVERSA COM RESPONSÁVEL:", d?.conversa_familia, curY);
        curY = sessao("OBSERVAÇÕES GERAIS:", d?.obs, curY);
        curY = sessao("DEVOLUTIVA E ENCAMINHAMENTOS:", d?.feedback, curY);

        doc.save(`Ata_${nome.replace(/\s/g, '_')}.pdf`);
    }
</script>
