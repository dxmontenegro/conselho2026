<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conselho Digital - EEMTI Dragão do Mar</title>
    <link rel="icon" type="image/png" href="imagem1.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --primary:#1a73e8;--bg:#f0f2f5;--card-bg:#fff;--danger:#dc3545;--success:#28a745;--text:#3c4043; }

        body{
            font-family:'Segoe UI',Tahoma,sans-serif;
            background:var(--bg);
            margin:0;
            color:var(--text);
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        #app-root{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        .hidden{display:none!important;}

        /* Auth & Forms */
        .auth-container{max-width:450px;margin:40px auto;padding:30px;background:white;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
        input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1.5px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:1rem;}
        label{display:block;text-align:left;font-weight:bold;font-size:.85rem;margin-top:10px;color:var(--primary);}

        /* Buttons */
        button{cursor:pointer;border:none;border-radius:10px;font-weight:bold;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px;}
        .btn-main{background:var(--primary);color:white;padding:16px;width:100%;font-size:1rem;margin-top:10px;}
        .btn-link{background:none;color:var(--primary);font-size:.9rem;text-decoration:underline;margin-top:10px;width:100%;}

        /* Dashboard Layout */
        #dashboard{flex:1;display:flex;flex-direction:column;}
        .header-dash{display:flex;justify-content:space-between;align-items:center;background:white;padding:10px 25px;border-bottom:1px solid #ddd;z-index:100;}
        .btn-header{color:white;padding:6px 12px;font-size:.8rem;}
        .btn-voltar{background:#6c757d;}
        .btn-sair{background:var(--danger);}

        .carousel-container{position:relative;flex-grow:1;display:flex;align-items:center;overflow:hidden;background:#e9ecef;}
        .student-track{display:flex;transition:transform .4s cubic-bezier(.4,0,.2,1);width:100%;height:100%;}
        .student-card{min-width:100%;display:flex;justify-content:center;align-items:center;padding:20px;box-sizing:border-box;}

        /* Card horizontal com foto e bimestres */
        .card-content{background:white;width:95%;max-width:960px;padding:20px;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,0.1);display:flex;gap:24px;align-items:flex-start;max-height:90vh;overflow-y:auto;}
        .photo-area{flex:0 0 190px;text-align:center;}
        .photo-placeholder{width:160px;height:160px;border-radius:50%;background:#f0f7ff;border:4px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin:0 auto;}
        .photo-placeholder img{width:100%;height:100%;object-fit:cover;}
        .btn-upload-label{margin-top:10px;display:inline-block;background:var(--primary);color:white;padding:6px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;}

        .bimestres-container{flex:1;}
        .tabs{display:flex;gap:8px;margin:4px 0 10px 0;}
        .tab-btn{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;background:#f8f9fa;cursor:pointer;font-size:.85rem;font-weight:bold;}
        .tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
        .tab-content{display:none;}
        .tab-content.active{display:block;}

        /* Switches */
        .toggle-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#f8f9fa;border-radius:10px;margin-bottom:4px;border:1px solid #eee;font-size:.85rem;}
        .toggle-destaque{background:#e8f0fe;border:1px solid var(--primary);}
        .switch{position:relative;display:inline-block;width:34px;height:18px;}
        .switch input{opacity:0;width:0;height:0;}
        .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:20px;}
        .slider:before{position:absolute;content:"";height:12px;width:12px;left:3px;bottom:3px;background-color:white;transition:.4s;border-radius:50%;}
        input:checked + .slider{background-color:var(--success);}
        input:checked + .slider:before{transform:translateX(16px);}

        textarea{height:60px;resize:none;font-size:.85rem;}

        .btn-pdf{background:#5f6368;color:white;width:100%;padding:12px;margin-top:10px;}

        .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);background:var(--primary);color:white;width:50px;height:50px;border-radius:50%;z-index:2000;border:none;font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,0.2);}
        .nav-arrow:disabled{background:#ccc;cursor:not-allowed;opacity:.5;}
        .arrow-left{left:15px;}
        .arrow-right{right:15px;}

        /* Rodapé fixo no fim da página */
        footer{
            background:#ffffff;
            border-top:1px solid #ddd;
            text-align:center;
            font-size:0.75rem;
            color:#666;
            padding:6px 10px;
        }

        /* --- Ajustes para telas menores (celular) --- */
        @media (max-width: 768px) {
          .auth-container {
            margin: 20px 10px;
            padding: 20px 15px;
            border-radius: 16px;
          }

          .carousel-container {
            padding: 10px 0;
          }

          .student-card {
            padding: 10px;
          }

          .card-content {
            flex-direction: column;
            max-width: 100%;
            max-height: none;
          }

          .photo-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
          }

          .photo-placeholder {
            width: 120px;
            height: 120px;
          }

          .bimestres-container {
            width: 100%;
          }

          .header-dash {
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
          }

          .header-dash > div {
            width: 100%;
            justify-content: flex-end;
          }

          .tabs {
            flex-wrap: wrap;
          }

          .tab-btn {
            flex: 1 1 48%;
            font-size: 0.8rem;
            padding: 6px;
          }

          textarea {
            font-size: 0.8rem;
          }

          .btn-pdf {
            font-size: 0.85rem;
            padding: 10px;
          }

          .nav-arrow {
            width: 40px;
            height: 40px;
            font-size: 20px;
          }
        }

        @media (max-width: 420px) {
          .card-content {
            padding: 15px 10px;
          }

          .toggle-item {
            font-size: 0.75rem;
            padding: 6px 8px;
          }

          .btn-upload-label {
            font-size: 0.75rem;
            padding: 4px 8px;
          }

          .tab-btn {
            flex: 1 1 48%;
            font-size: 0.75rem;
          }
        }
    </style>
</head>

<div id="app-root">
    <!-- LOGIN (mantido) -->
    <div id="tela-login" class="auth-container">
        <img src="imagem1.png" style="width:70px;margin-bottom:10px;">
        <h2>CONSELHO DIGITAL 2026</h2>
        <input type="email" id="login-email" placeholder="E-mail">
        <input type="password" id="login-senha" placeholder="Senha">
        <button class="btn-main" onclick="acaoLogin()">🚀 ENTRAR NO SISTEMA</button>
        <button class="btn-link" onclick="mostrarTela('tela-cadastro')">📝 Criar nova conta</button>
        <button class="btn-link" onclick="recuperarSenha()">🔑 Esqueci minha senha</button>
    </div>

    <div id="tela-cadastro" class="auth-container hidden">
        <h2>Criar Conta</h2>
        <input type="email" id="cad-email" placeholder="Seu e-mail">
        <input type="password" id="cad-senha" placeholder="Senha (mín. 6 dígitos)">
        <button class="btn-main" onclick="acaoCriarConta()">✅ FINALIZAR CADASTRO</button>
        <button class="btn-link" onclick="mostrarTela('tela-login')">⬅️ Voltar ao Login</button>
    </div>

    <div id="tela-filtros" class="auth-container hidden">
        <h3>⚙️ Iniciar Sessão</h3>
        <label>Turno:</label>
        <select id="sel-turno" onchange="popularTurmas()">
            <option value="integral">Tempo Integral</option>
            <option value="noturno">Noturno</option>
        </select>
        <label>Turma:</label>
        <select id="sel-turma"></select>
        <button class="btn-main" onclick="iniciarConselho()">📂 ABRIR DIÁRIO DE BORDO</button>
    </div>

    <div id="dashboard" class="hidden">
        <div class="header-dash">
            <span id="info-header" style="font-weight:bold;color:var(--primary);"></span>
            <div style="display:flex;gap:10px;">
                <button class="btn-header btn-voltar" onclick="mostrarTela('tela-filtros')">⬅️ VOLTAR</button>
                <button class="btn-header btn-sair" onclick="location.reload()">⚠️ SAIR</button>
            </div>
        </div>
        <div class="carousel-container">
            <button class="nav-arrow arrow-left" id="btn-prev" onclick="moveSlide(-1)">❮</button>
            <div class="student-track" id="student-track"></div>
            <button class="nav-arrow arrow-right" id="btn-next" onclick="moveSlide(1)">❯</button>
        </div>
    </div>
</div>

<footer>
    DESENVOLVIDO PELA EEMTI DRAGÃO DO MAR - L.E.I. / GOVERNO DO ESTADO DO CEARÁ
</footer>

            "2º D": ["ANA LUIZA LOMBARDI MESQUITA", "ARIEL LUCAS CARVALHO", "ARIELY LETÍCIA LIMA OLIVEIRA", "DOUGLAS MARCELO FERNANDES OLIVEIRA DE MELO", "ELOIZA ZAQUEU DA SILVA SANTOS", "FAGNER LUCENA DA SILVA", "FRANCISCO DAVI RIBEIRO FREITAS", "FRANCISCO ELIVERTON ALVES DIAS", "FRANCISCO WEVERTON DOS SANTOS", "GABRIEL FREITAS DOS SANTOS", "GABRIEL HENRIQUE FREITAS DE CARVALHO", "GUILHERME GONCALVES SILVA", "GUSTAVO SILVA OLIVEIRA", "JOAO MARCOS NOGUEIRA PEREIRA", "JOSE ROMULO FACUNDE DA SILVA", "JULYAM NAYRIS GUEDES ALBUQUERQUE", "KATIANE DE SOUZA JULIAO GOMES", "KAUA CUNHA MATIAS", "LEANDRO RAQUEL GOMES", "LUCAS HONORIO DE SOUSA", "LUZIA KETTILY DIAS LOURENCO", "MARIA SUYANE BARBOSA GOMES", "NICOLE KETLIN DE OLIVEIRA", "PEDRO YTALLO ALVES DE ARAUJO MOTA", "RAY PEREIRA ROCHA NOGUEIRA", "RAYANE BERNARDO DA SILVA SOARES", "RIAN DE LIMA NASCIMENTO", "SARA ROCHA DE SENA", "TAINARA DE SOUZA"],
            "3º C": ["ANA LUISA PEREIRA DOS SANTOS", "ARYANE SILVA DA GUIA", "EDUARDO DA SILVA MACEDO ARAUJO", "ERIANA KEZIA NASCIMENTO RODRIGUES", "FRANCISCA ELLEN CASTRO DOS SANTOS", "ISRAEL LUIS DE PAULA ROCHA", "IZABELE MARTINS DE SOUSA", "JOAO MARCELO CESARIO DA SILVA", "KAUA CARDOSO DE OLIVEIRA", "KAUA KEVEN AZEVEDO DA SILVA", "LUCAS DIOGO DE SOUZA", "LUIZ DAVI CRUZ DA ROCHA", "MARIA JAMILE DE SOUSA PEREIRA", "MARIA REBECA SILVA DA CRUZ", "PAULO RENAN SILVA DE ALBUQUERQUE", "SAMUEL RODRIGUES GOMES", "SARA DOS SANTOS HAYASHI", "TAYNA DE PAULA SANTANA", "VITORIA CAROLINE MORAIS DE LIMA", "WESLEY SANTANA FIRMINO"]
        }
    };

    let currentIndex = 0;
    let totalAlunos = 0;

    function mostrarTela(id) {
        document.querySelectorAll('.auth-container, #dashboard').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function popularTurmas() {
        const turno = document.getElementById('sel-turno').value;
        const selTurma = document.getElementById('sel-turma');
        selTurma.innerHTML = '';
        if (turmasDados[turno]) {
            Object.keys(turmasDados[turno]).forEach(t => {
                selTurma.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }
    }

    async function acaoLogin() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-senha').value;
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert("Erro: " + error.message);
        else { mostrarTela('tela-filtros'); popularTurmas(); }
    }

    async function acaoCriarConta() {
        const email = document.getElementById('cad-email').value;
        const password = document.getElementById('cad-senha').value;
        const { error } = await _supabase.auth.signUp({ email, password });
        if (error) alert(error.message);
        else { alert("Sucesso! Faça login agora."); mostrarTela('tela-login'); }
    }

    async function recuperarSenha() {
        const email = prompt("Digite seu e-mail:");
        if (email) {
            const { error } = await _supabase.auth.resetPasswordForEmail(email);
            if (error) alert(error.message);
            else alert("E-mail de recuperação enviado!");
        }
    }

    async function sync(nome, bimestre, campo, valor) {
        const turma = document.getElementById('sel-turma').value;
        await _supabase.from('conselho_classe').upsert(
            { nome, turma, bimestre, [campo]: valor },
            { onConflict: 'nome,turma,bimestre' }
        );
    }

    async function uploadFoto(nome, input) {
        const file = input.files[0];
        if (!file) return;
        const idSeguro = nome.replace(/\s/g, '');
        const path = `fotos/${idSeguro}_${Date.now()}.png`;
        const { error } = await _supabase.storage.from('fotos-alunos').upload(path, file);
        if (!error) {
            const { data: { publicUrl } } = _supabase.storage.from('fotos-alunos').getPublicUrl(path);
            document.getElementById(`img-${idSeguro}`).innerHTML = `<img src="${publicUrl}" crossorigin="anonymous">`;
            for (const b of ["1º","2º","3º","4º"]) {
                await sync(nome, b, 'foto_url', publicUrl);
            }
        }
    }

    async function iniciarConselho() {
        const turno = document.getElementById('sel-turno').value;
        const turma = document.getElementById('sel-turma').value;
        const nomes = turmasDados[turno][turma];
        totalAlunos = nomes.length;
        currentIndex = 0;

        document.getElementById('info-header').innerText = `🏫 ${turma} | 🗓️ Relatório Anual 2026`;
        const track = document.getElementById('student-track');
        track.innerHTML = '🔄 Carregando dados do servidor...';

        const { data: todosRegistros } = await _supabase
            .from('conselho_classe')
            .select('*')
            .eq('turma', turma);

        let html = '';
        nomes.forEach(nome => {
            const registrosAluno = (todosRegistros || []).filter(r => r.nome === nome);
            const dadosPorBim = { "1º": {}, "2º": {}, "3º": {}, "4º": {} };
            registrosAluno.forEach(r => {
                if (dadosPorBim[r.bimestre] !== undefined) {
                    dadosPorBim[r.bimestre] = r;
                }
            });

            const fUrl = registrosAluno.find(r => r.foto_url)?.foto_url || '';
            const idSeguro = nome.replace(/\s/g, '');

            let bimestresHTML = '';
            ["1º", "2º", "3º", "4º"].forEach((bim, idx) => {
                const db = dadosPorBim[bim] || {};
                bimestresHTML += `
                <div id="tab-${idSeguro}-${bim}" class="tab-content ${idx===0?'active':''}">
                    <div class="toggle-item"><span>⚠️ Infrequente</span>
                        <label class="switch">
                            <input type="checkbox" onchange="sync('${nome}','${bim}','infrequente',this.checked)" ${db.infrequente?'checked':''}>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-item"><span>📉 Baixa Participação</span>
                        <label class="switch">
                            <input type="checkbox" onchange="sync('${nome}','${bim}','participacao',this.checked)" ${db.participacao?'checked':''}>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-item"><span>📚 Sem Atividades</span>
                        <label class="switch">
                            <input type="checkbox" onchange="sync('${nome}','${bim}','atividades',this.checked)" ${db.atividades?'checked':''}>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-item"><span>🚫 Indisciplina</span>
                        <label class="switch">
                            <input type="checkbox" onchange="sync('${nome}','${bim}','disciplina',this.checked)" ${db.disciplina?'checked':''}>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-item toggle-destaque"><span>📞 Contato PDT</span>
                        <label class="switch">
                            <input type="checkbox" onchange="sync('${nome}','${bim}','pdt_contato',this.checked)" ${db.pdt_contato?'checked':''}>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-item toggle-destaque"><span>👪 Contato Família</span>
                        <label class="switch">
                            <input type="checkbox" onchange="sync('${nome}','${bim}','familia_contato',this.checked)" ${db.familia_contato?'checked':''}>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <label>📝 Observação Pedagógica (${bim}):</label>
                    <textarea onblur="sync('${nome}','${bim}','obs',this.value)">${db.obs || ''}</textarea>

                    <label>🎯 Encaminhamento Final (${bim}):</label>
                    <textarea onblur="sync('${nome}','${bim}','feedback',this.value)">${db.feedback || ''}</textarea>
                </div>`;
            });

            html += `
            <div class="student-card">
                <div class="card-content">
                    <div class="photo-area">
                        <div class="photo-placeholder" id="img-${idSeguro}">
                            ${fUrl ? `<img src="${fUrl}" crossorigin="anonymous">` : '👤'}
                        </div>
                        <label class="btn-upload-label">
                            📷 Atualizar Foto
                            <input type="file" class="hidden" onchange="uploadFoto('${nome}', this)">
                        </label>
                    </div>
                    <div class="bimestres-container">
                        <h3 style="margin:0 0 5px 0;">${nome}</h3>
                        <div class="tabs">
                            <button class="tab-btn active" onclick="trocarAba('${idSeguro}','1º', event)">1º Bim</button>
                            <button class="tab-btn" onclick="trocarAba('${idSeguro}','2º', event)">2º Bim</button>
                            <button class="tab-btn" onclick="trocarAba('${idSeguro}','3º', event)">3º Bim</button>
                            <button class="tab-btn" onclick="trocarAba('${idSeguro}','4º', event)">4º Bim</button>
                        </div>
                        ${bimestresHTML}
                        <button class="btn-pdf" onclick="gerarPdfAnual('${nome}')">📥 BAIXAR RELATÓRIO ANUAL</button>
                    </div>
                </div>
            </div>`;
        });

        track.innerHTML = html;
        mostrarTela('dashboard');
        moveSlide(0);
    }

    function trocarAba(idSeguro, bim, ev) {
        ["1º", "2º", "3º", "4º"].forEach(b => {
            const el = document.getElementById(`tab-${idSeguro}-${b}`);
            if (el) el.classList.remove('active');
        });
        const atual = document.getElementById(`tab-${idSeguro}-${bim}`);
        if (atual) atual.classList.add('active');

        const btns = ev.currentTarget.parentElement.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        ev.currentTarget.classList.add('active');
    }

    function moveSlide(dir) {
        currentIndex = Math.max(0, Math.min(totalAlunos - 1, currentIndex + dir));
        document.getElementById('student-track').style.transform = `translateX(-${currentIndex * 100}%)`;
        document.getElementById('btn-prev').disabled = (currentIndex === 0);
        document.getElementById('btn-next').disabled = (currentIndex === totalAlunos - 1);
    }

    async function gerarPdfAnual(nome) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const turma = document.getElementById('sel-turma').value;

        const { data: regs } = await _supabase
            .from('conselho_classe')
            .select('*')
            .match({ nome, turma });

        const fotoUrl = (regs || []).find(r => r.foto_url)?.foto_url;

        doc.setFillColor(26,115,232);
        doc.rect(0,0,210,35,'F');
        doc.setTextColor(255,255,255);
        doc.setFontSize(18);
        doc.text("EEMTI DRAGÃO DO MAR",105,18,{align:'center'});
        doc.setFontSize(12);
        doc.text("RELATÓRIO ANUAL DO ALUNO - 2026",105,26,{align:'center'});

        if (fotoUrl) {
            try {
                const img = new Image();
                img.src = fotoUrl;
                img.crossOrigin = "anonymous";
                await new Promise(r => { img.onload = r; img.onerror = r; });
                if (img.complete) doc.addImage(img, 'JPEG', 160, 40, 30, 30);
            } catch(e) {}
        }

        doc.setTextColor(0);
        doc.setFontSize(11);
        doc.text(`ALUNO: ${nome}`, 20, 45);
        doc.text(`TURMA: ${turma}`, 20, 52);
        doc.line(20, 56, 190, 56);

        let y = 64;
        const ordem = ["1º", "2º", "3º", "4º"];

        ordem.forEach(b => {
            const d = (regs || []).find(r => r.bimestre === b) || {};
            if (y > 260) { doc.addPage(); y = 20; }

            doc.setFont("helvetica", "bold");
            doc.text(`${b} BIMESTRE`, 20, y);
            y += 6;

            doc.setFont("helvetica", "normal");
            doc.text(`Frequência irregular: ${d.infrequente?'SIM':'NÃO'}   |   Baixa participação: ${d.participacao?'SIM':'NÃO'}`, 20, y);
            y += 5;
            doc.text(`Sem atividades: ${d.atividades?'SIM':'NÃO'}        |   Indisciplina: ${d.disciplina?'SIM':'NÃO'}`, 20, y);
            y += 5;
            doc.text(`Contato PDT: ${d.pdt_contato?'SIM':'NÃO'}          |   Contato Família: ${d.familia_contato?'SIM':'NÃO'}`, 20, y);
            y += 7;

            const obsLines = doc.splitTextToSize(`OBSERVAÇÕES: ${d.obs || 'Nada registrado.'}`, 170);
            doc.text(obsLines, 20, y);
            y += obsLines.length * 4 + 4;

            const fbLines = doc.splitTextToSize(`ENCAMINHAMENTO: ${d.feedback || 'Nada registrado.'}`, 170);
            doc.text(fbLines, 20, y);
            y += fbLines.length * 4 + 8;
        });

        doc.save(`Relatorio_Anual_${nome}.pdf`);
    }
</script>
