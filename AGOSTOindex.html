        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;}
        #app-root{flex:1;display:flex;flex-direction:column;}
        .hidden{display:none!important;}
        .loading{padding:40px;text-align:center;color:var(--primary);}

        input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1.5px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:1rem;}
        label{display:block;text-align:left;font-weight:bold;font-size:.85rem;margin-top:10px;color:var(--primary);}
        button{cursor:pointer;border:none;border-radius:10px;font-weight:bold;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px;}
        .btn-main{background:var(--primary);color:white;padding:16px;width:100%;font-size:1rem;margin-top:10px;}
        .btn-main:disabled{background:#ccc;cursor:not-allowed;}
        .btn-link{background:none;color:var(--primary);font-size:.9rem;text-decoration:underline;margin-top:10px;width:100%;}
        #dashboard{flex:1;display:flex;flex-direction:column;}
        .header-dash{display:flex;justify-content:space-between;align-items:center;background:white;padding:10px 25px;border-bottom:1px solid #ddd;}
        .btn-header{color:white;padding:6px 12px;font-size:.8rem;}
        .btn-voltar{background:#6c757d;}
        .btn-sair{background:var(--danger);}
        .carousel-container{position:relative;flex-grow:1;display:flex;align-items:center;overflow:hidden;background:#e9ecef;}
        .student-track{display:flex;transition:transform .4s cubic-bezier(.4,0,.2,1);width:100%;height:100%;}
        .student-card{min-width:100%;display:flex;justify-content:center;align-items:center;padding:20px;box-sizing:border-box;}
        .card-content{background:white;width:95%;max-width:960px;padding:20px;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,0.1);display:flex;gap:24px;align-items:flex-start;max-height:90vh;overflow-y:auto;}
        .photo-area{flex:0 0 190px;text-align:center;}
        .photo-placeholder{width:160px;height:160px;border-radius:50%;background:#f0f7ff;border:4px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin:0 auto;}
        .photo-placeholder img{width:100%;height:100%;object-fit:cover;}
        .btn-upload-label{margin-top:10px;display:inline-block;background:var(--primary);color:white;padding:6px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;}
        .bimestres-container{flex:1;}
        .ocorrencias-section{background:var(--ocorrencias-bg);padding:20px;border-radius:12px;border-left:5px solid var(--ocorrencias-border);margin-bottom:20px;}
        .ocorrencias-header{display:flex;align-items:center;gap:10px;margin-bottom:15px;font-weight:bold;color:#856404;font-size:1.1rem;}
        .ocorrencias-count{background:var(--warning);color:#856404;padding:4px 12px;border-radius:20px;font-weight:bold;font-size:.9rem;}
        .ocorrencias-list{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
        .ocorrencia-item{background:white;padding:12px;border-radius:8px;border-left:4px solid var(--primary);font-size:.9rem;display:flex;align-items:center;gap:12px;}
        .ocorrencia-grave{border-left-color:var(--danger);background:#f8d7da;}
        .ocorrencia-leve{border-left-color:var(--success);background:#d4edda;}
        .ocorrencia-badge{font-weight:bold;padding:2px 8px;border-radius:12px;font-size:.8rem;}
        .badge-grave{background:#f8b2b2;color:#721c24;}
        .badge-leve{background:#b5eab5;color:#155724;}
        .sem-ocorrencias{text-align:center;padding:20px;color:var(--success);font-weight:bold;}
        .tabs{display:flex;gap:8px;margin:4px 0 10px 0;flex-wrap:wrap;}
        .tab-btn{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;background:#f8f9fa;cursor:pointer;font-size:.85rem;font-weight:bold;min-width:70px;}
        .tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        .toggle-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#f8f9fa;border-radius:10px;margin-bottom:4px;border:1px solid #eee;font-size:.85rem;}
        .toggle-destaque{background:#e8f0fe;border:1px solid var(--primary);}
        .switch{position:relative;display:inline-block;width:34px;height:18px;}
        .switch input{opacity:0;width:0;height:0;}
        .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:20px;}
        .slider:before{position:absolute;content:"";height:12px;width:12px;left:3px;bottom:3px;background-color:white;transition:.4s;border-radius:50%;}
        input:checked + .slider{background-color:var(--success);}
        /* 🔴 ACL piscando */
         @keyframes piscarACL {
        0% { background-color: #dc3545; }
        50% { background-color: #ff6b6b; }
         100% { background-color: #dc3545; }
}
.toggle-acl input:checked + .slider {
    animation: piscarACL 0.7s infinite !important;
}

/* 🔴 TEXTO ACL piscando + negrito (CORRIGIDO) */
.toggle-acl .acl-label{
    font-weight: bold;
}

@keyframes piscarTextoACL {
    0% { color: #dc3545; }
    50% { color: #000; }
    100% { color: #dc3545; }
}

/* 🔴 TEXTO ACL piscando quando ativo */
.toggle-acl input:checked {
    animation: none;
}

.toggle-acl input:checked ~ * .acl-label,
.toggle-acl input:checked + .slider {
    animation: none;
}

/* 🔥 solução alternativa (forçada via classe do pai) */
.toggle-acl:has(input:checked) .acl-label {
    animation: piscarTextoACL 0.7s infinite;
}

        input:checked + .slider:before{transform:translateX(16px);}

async function resetSenha(){
  const email = prompt("Digite seu e-mail para recuperar a senha:");
  if(!email) return;

  const { error } = await _supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin
  });

  if(error){
    alert("Erro: " + error.message);
  } else {
    alert("Verifique seu e-mail para redefinir a senha.");
  }
}

function acaoSair() { location.reload(); }
function validarEdicao(e){
  if(!podeEditar()){
    e.preventDefault();
    alert("EEMTI DRAGÃO DO MAR\n\nSomente e-mails da gestão podem alterar dados!");
    return false;
  }
  return true;
}
async function salvarNovaSenha(){
  const novaSenha = document.getElementById('nova-senha').value;

  if(novaSenha.length < 6){
    alert("A senha deve ter no mínimo 6 caracteres!");
    return;
  }

  const { error } = await _supabase.auth.updateUser({
    password: novaSenha
  });

  if(error){
    alert("Erro: " + error.message);
  } else {
    alert("Senha atualizada com sucesso!");
    mostrarTela('tela-login');
  }
}
async function acaoCriarConta(){
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;

  if(!email || !senha){
    alert("Preencha todos os campos!");
    return;
  }

  if(senha.length < 6){
    alert("A senha deve ter no mínimo 6 caracteres!");
    return;
  }

  try{
    const { data, error } = await _supabase.auth.signUp({
      email: email.toLowerCase(),
      password: senha
    });

    if(error){
      alert("Erro: " + error.message);
    } else {
      alert("Cadastro realizado com sucesso! Verifique seu e-mail.");
      mostrarTela('tela-login');
    }

  } catch(e){
    alert("Erro de conexão");
  }
}

 async function toggleACLGlobal(nome, valor){
    const turma = document.getElementById('sel-turma').value;
    const bimestres = ["1º","2º","3º","4º"];

    for(const bim of bimestres){
        await _supabase.from('conselho_classe').upsert(
            { nome, turma, bimestre: bim, acl: valor },
            { onConflict: 'nome,turma,bimestre' }
        );
    }
}


// 🔥 ATUALIZAÇÃO EM TEMPO REAL (ALUNO ESPECÍFICO)
async function atualizarAluno(nome){

  const turmaEl = document.getElementById('sel-turma');
  if(!turmaEl) return;

  const turma = turmaEl.value;

  const { data: registros } = await _supabase
    .from('conselho_classe')
    .select('*')
    .eq('nome', nome)
    .eq('turma', turma);

  if(!registros) return;

  ["1º","2º","3º","4º"].forEach(bim => {

    const db = registros.find(r => r.bimestre === bim) || {};

    const idSeguro = nome
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s/g, "")
      .replace(/[^a-zA-Z0-9]/g, "");

    const container = document.getElementById(`tab-${idSeguro}-${bim}`);
    if(!container) return;

    // CHECKBOXES
    const inputs = container.querySelectorAll("input[type='checkbox']");
    
   inputs.forEach(input => {
  const campo = input.dataset.campo;

  if(campo && db[campo] !== undefined){
    input.checked = db[campo];
  }
});

    // TEXTAREAS
    const textareas = container.querySelectorAll("textarea");

    if(textareas[0]) textareas[0].value = db.obs || '';
    if(textareas[1]) textareas[1].value = db.feedback || '';

  });

  console.log("Aluno atualizado:", nome);
}
